<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>板まるごとリアルタイム監視（最新30件）</title>
<style>
    body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
    #timeline { display: flex; flex-direction: column; }
    .res-card { border-radius: 6px; padding: 10px; margin-bottom: 5px; background: #fff; }
    .thread-origin { font-size: 0.8em; color: #0066cc; font-weight: bold; margin-bottom: 6px; border-bottom: 1px dashed #ddd; padding-bottom: 4px; }
    .res-header { font-size: 0.85em; color: #555; margin-bottom: 4px; }
    .res-num { font-weight: bold; color: #111; }
    .res-name { color: #228b22; font-weight: bold; }
    .res-body { font-size: 0.95em; line-height: 1.5; white-space: pre-wrap; word-break: break-all; margin-top: 6px; }
</style>
</head>
<body>

<div id="timeline"></div>

<script>
const BOARD_BASE_URL = './';
const REFRESH_INTERVAL = 1500;

let threadMap = {};

function decodeShiftJIS(buf) {
    return new TextDecoder('shift-jis').decode(buf);
}

// subject.txt を読む
async function updateThreadList() {
    const res = await fetch(`${BOARD_BASE_URL}subject.txt`, { cache: 'no-store' });
    const buf = await res.arrayBuffer();
    const text = decodeShiftJIS(buf);

    text.split('\n').forEach(line => {
        const m = line.match(/^(.+\.dat)<>(.+)\s\((\d+)\)$/);
        if (m) {
            const datFile = m[1];
            const title = m[2];
            if (!threadMap[datFile]) {
                threadMap[datFile] = { title };
            }
        }
    });
}

// 日付文字列を UNIX 時間に変換（2ch形式）
function parse2chDate(str) {
    // 例: "2024/02/01(木) 12:34:56.12 ID:xxxx"
    const m = str.match(/(\d{4})\/(\d{2})\/(\d{2}).*?(\d{2}):(\d{2}):(\d{2})/);
    if (!m) return 0;
    const [_, y, mo, d, h, mi, s] = m.map(Number);
    return new Date(y, mo - 1, d, h, mi, s).getTime();
}

// dat を読み、レスを配列化
async function readDat(datFile) {
    try {
        const res = await fetch(`${BOARD_BASE_URL}dat/${datFile}`, { cache: 'no-store' });
        if (!res.ok) return [];

        const buf = await res.arrayBuffer();
        const text = decodeShiftJIS(buf);
        const lines = text.split('\n').filter(x => x.trim() !== '');

        const threadTitle = threadMap[datFile].title;

        return lines.map((line, idx) => {
            const el = line.split('<>');
            if (el.length < 4) return null;

            const name = el[0] || '名無しさん';
            const email = el[1];
            const dateAndId = el[2];
            const body = el[3].replace(/<br>/g, '\n');

            return {
                datFile,
                threadTitle,
                resNum: idx + 1,
                name,
                email,
                dateAndId,
                body,
                timestamp: parse2chDate(dateAndId)
            };
        }).filter(Boolean);

    } catch (e) {
        console.warn("dat error:", datFile, e);
        return [];
    }
}

// 全 dat を読み、全レスを時系列で 30 件だけ描画
async function crawlAll() {
    let allRes = [];

    for (const datFile of Object.keys(threadMap)) {
        const resList = await readDat(datFile);
        allRes.push(...resList);
        await new Promise(r => setTimeout(r, 30)); // 軽い負荷分散
    }

    // 時系列で新しい順にソート
    allRes.sort((a, b) => b.timestamp - a.timestamp);

    // 最新30件だけ
    const latest = allRes.slice(0, 30);

    const timeline = document.getElementById('timeline');
    timeline.innerHTML = '';

    latest.forEach(res => {
        const card = document.createElement('div');
        card.className = 'res-card';

        const origin = document.createElement('div');
        origin.className = 'thread-origin';
        origin.textContent = `[スレ] ${res.threadTitle}`;

        const header = document.createElement('div');
        header.className = 'res-header';
        header.innerHTML =
            `<span class="res-num">${res.resNum}</span> : ` +
            `<span class="res-name">${res.name}</span> [${res.email}] ${res.dateAndId}`;

        const body = document.createElement('div');
        body.className = 'res-body';
        body.textContent = res.body;

        card.appendChild(origin);
        card.appendChild(header);
        card.appendChild(body);

        timeline.appendChild(card);
    });
}

async function main() {
    await updateThreadList();
    await crawlAll();
    setInterval(crawlAll, REFRESH_INTERVAL);
}

main();
</script>
</body>
</html>
